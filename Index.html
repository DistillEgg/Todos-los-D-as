<style>

  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  .ui{position:fixed;z-index:2;pointer-events:none}
  .ui *{pointer-events:auto}
  /* brand */
  #brand{top:22px;left:26px}
  #brand .n{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:.5px;font-weight:400}
  #brand .k{font-size:10px;letter-spacing:2px;color:var(--mut);margin-top:2px;font-style:italic}
  #brand .k2{font-size:9px;letter-spacing:2px;color:var(--mut);margin-top:3px;font-style:italic}
  /* stage prompts */
  .hint{font-size:12px;color:var(--mut);letter-spacing:.5px;max-width:200px;line-height:1.5}
  #hRoot{top:108px;left:30px;transform:rotate(-1.5deg)}
  #hDens{top:110px;right:40px;text-align:right;transform:none}
  #hCard{top:auto;bottom:26%;left:50%;transform:translateX(-50%);text-align:center}
  #hRefl{top:62%;right:42px;text-align:right}
  /* notes */
  #notes{top:150px;left:30px;display:flex;flex-wrap:nowrap;gap:6px 9px;max-width:460px}
  .nt{font-family:ui-monospace,Menlo,monospace;font-size:14px;padding:4px 9px;border:1px solid var(--line);
      border-radius:3px;cursor:pointer;background:rgba(255,255,255,.35);user-select:none;transition:.12s}
  .nt:hover{border-color:var(--ink)}
  .nt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  /* density */
  #dens{top:300px;right:40px;display:flex;gap:16px}
  .dm{font-size:15px;cursor:pointer;color:var(--mut);border-bottom:1px solid transparent;padding-bottom:2px}
  .dm:hover{color:var(--ink)}
  .dm.on{color:var(--ink);border-color:var(--ink)}
  /* card */
  #cardWrap{top:auto;bottom:17%;left:50%;transform:translateX(-50%)}
  #draw{font-family:Georgia,serif;font-size:22px;cursor:pointer;background:none;border:1px solid var(--ink);
        border-radius:40px;padding:10px 30px;letter-spacing:1px}
  #draw:hover{background:var(--ink);color:var(--paper)}
  /* small corners */
  #no{position:fixed;bottom:20px;right:26px;z-index:2;font-family:ui-monospace,monospace;font-size:12px;color:#5a554c}
  #trace{position:fixed;bottom:20px;left:26px;z-index:2;font-size:12px;color:#5a554c;cursor:pointer;letter-spacing:1px}
  #trace:hover{color:var(--ink)}
  #refl{position:fixed;bottom:46px;right:26px;z-index:3;max-width:230px;text-align:right;font-size:11px;color:#5a554c;
        line-height:1.5;opacity:0;transition:.4s;pointer-events:none}
  #refl.show{opacity:1}
  .thin{position:fixed;background:var(--line);z-index:1}
  #r1{top:104px;left:26px;width:120px;height:1px;transform:rotate(-1.5deg)}
  .foot{position:fixed;bottom:46px;left:50%;transform:translateX(-50%) rotate(-.6deg);z-index:1;
        font-size:11px;color:#5a554c;letter-spacing:3px;font-style:italic}
  .hidden{display:none!important}
</style>
</head>

<div class="ui hint hidden" id="hCard">抽一张。<br>看它把你带去哪。</div>
<div class="ui hidden" id="cardWrap"><button id="draw">抽</button></div>

<div class="ui hint" id="hRefl">留下的，是直觉的声音。</div>

<script>
var TP=JSON.parse(document.getElementById('data-task_pool').textContent);
var MOT=JSON.parse(document.getElementById('data-motifs').textContent);

/* ---------- valid jazz vocabulary (guard the bottom line) ---------- */
var PROGS=[];
TP.tasks.forEach(function(t){
  t.candidate_reharmonization_set.forEach(function(c){
    if(c.chord_sequence && c.chord_sequence.length>=2) PROGS.push(c.chord_sequence);
  });
});
var TECHS=TP.tasks.map(function(t){return t.technique_name;});
var ROOTS={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
var RN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function parseChord(s){
  if(!s) return null;
  var m=s.match(/^([A-G])(#|b)?(.*)$/); if(!m) return null;
  var root=ROOTS[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));
  var q=m[3]||'', iv;
  if(/dim/.test(q)) iv=[0,3,6,9];
  else if(/m(?!aj)/.test(q)){ if(/maj7/.test(q)) iv=[0,3,7,11]; else if(/7/.test(q)) iv=[0,3,7,10]; else iv=[0,3,7]; }
  else { if(/maj7/.test(q)) iv=[0,4,7,11]; else if(/7/.test(q)) iv=[0,4,7,10]; else if(/6/.test(q)) iv=[0,4,7,9]; else iv=[0,4,7]; }
  if(/sus/.test(q)) iv=[0,5,7];
  if(/alt/.test(q)) iv=[0,4,7,10,13,15,21];
  if(/9/.test(q)&&!/b9|#9/.test(q)) iv.push(14);
  if(/11/.test(q)) iv.push(17);
  if(/13/.test(q)) iv.push(21);
  if(/b9/.test(q)) iv.push(13);
  if(/#9/.test(q)) iv.push(15);
  if(/b5/.test(q)) iv.push(6);
  if(/#5/.test(q)) iv.push(8);
  var bass=null; var sl=s.split('/'); if(sl[1]){ var bm=sl[1].match(/^([A-G])(#|b)?/); if(bm) bass=ROOTS[bm[1]]+(bm[2]==='#'?1:(bm[2]==='b'?-1:0)); }
  return {root:((root%12)+12)%12, iv:iv, bass:bass, q:q};
}
function transposeChord(sym, semi){
  var m=sym.match(/^([A-G])(#|b)?(.*)$/); if(!m) return sym;
  var r=ROOTS[m[1]]+(m[2]==='#'?1:(m[2]==='b'?-1:0));
  r=((r+semi)%12+12)%12; return RN[r]+m[3];
}
function moodOf(q){
  if(/m(?!aj)/.test(q)) return 'min';
  if(/7/.test(q)&&!/maj/.test(q)) return 'dom';
  if(/maj/.test(q)) return 'maj';
  if(/sus/.test(q)) return 'sus';
  return 'neu';
}

/* ---------- audio ---------- */
var AC=null, pending=[];
function ac(){ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); } if(AC.state==='suspended') AC.resume(); return AC; }
function nowt(){ return AC?AC.currentTime:0; }
function schedNote(midi,t,dur,type,vol,lp){
  var a=AC, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=440*Math.pow(2,(midi-69)/12);
  var head=o;
  if(lp){ var f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; o.connect(f); f.connect(g); } else o.connect(g);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}
var STYLE={
  lofi:{bpm:74, type:'triangle', lp:1150, mel:0.11, ch:0.09, bs:0.16},
  jazz:{bpm:112, type:'triangle', lp:2600, mel:0.12, ch:0.10, bs:0.17}
};
function playCombo(chords, melody, styleKey){
  var a=ac(); var t0=a.currentTime+0.06; var st=STYLE[styleKey]; var beat=60/st.bpm; var bar=4;
  chords.forEach(function(ch,i){
    var p=parseChord(ch); if(!p) return; var bT=t0+i*bar*beat;
    schedNote(36+p.root, bT, bar*beat*0.92, 'sine', st.bs, st.lp);
    p.iv.forEach(function(iv,k){ schedNote(60+p.root+iv, bT+k*0.13, bar*beat*0.5, st.type, st.ch, st.lp); });
    pending.push({t:bT, pc:p.root, mood:moodOf(p.q)});
  });
  melody.forEach(function(e){
    var t=t0+e.startBeat*beat;
    schedNote(e.midi, t, e.durBeats*beat*0.9, st.type, st.mel, st.lp);
    pending.push({t:t, pc:((e.midi)%12+12)%12, mood:'mel'});
  });
}

/* ---------- visual ---------- */
var cv=document.getElementById('cv'), cx=cv.getContext('2d'), W,H, DPR=Math.min(2,window.devicePixelRatio||1);
function resize(){ W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR; cx.setTransform(DPR,0,0,DPR,0,0); W=innerWidth; H=innerHeight; buildGrain(); buildBase(); }
var baseLayer=null;
function buildBase(){
  baseLayer=document.createElement('canvas'); baseLayer.width=W; baseLayer.height=H; var b=baseLayer.getContext('2d');
  var n=13+Math.floor(Math.random()*6);
  for(var i=0;i<n;i++){
    var x0=W*(0.08+Math.random()*0.84), y0=H*(0.12+Math.random()*0.74);
    var x1=W*(0.08+Math.random()*0.84), y1=H*(0.12+Math.random()*0.74);
    var cx2=W*(0.08+Math.random()*0.84), cy2=H*(0.08+Math.random()*0.84);
    var red=Math.random()<0.18;
    b.strokeStyle= red?'rgba(185,72,53,'+(0.10+Math.random()*0.20).toFixed(3)+')':'rgba(40,36,32,'+(0.08+Math.random()*0.16).toFixed(3)+')';
    b.lineWidth=0.6+Math.random()*2.8; b.lineCap='round';
    b.beginPath(); b.moveTo(x0,y0); b.quadraticCurveTo(cx2,cy2,x1,y1); b.stroke();
  }
  for(var j=0;j<2;j++){ b.strokeStyle='rgba(205,228,238,0.05)'; b.lineWidth=0.6+Math.random(); b.beginPath(); b.arc(W*(0.2+Math.random()*0.6),H*(0.2+Math.random()*0.6),40+Math.random()*120,0,Math.PI*2); b.stroke(); }
}
addEventListener('resize',resize);
var grain=null;
function buildGrain(){
  grain=document.createElement('canvas'); grain.width=W; grain.height=H; var g=grain.getContext('2d');
  var img=g.createImageData(W,H), d=img.data;
  for(var i=0;i<d.length;i+=4){ var v=200+Math.random()*55|0; d[i]=d[i+1]=d[i+2]=v; d[i+3]=Math.random()*14|0; }
  g.putImageData(img,0,0);
}
var strokes=[], curHue=30, sweep=0;
var PAL={ min:[210,40,40], dom:[12,8,8], maj:[32,22,10], sus:[150,18,22], neu:[40,8,8], mel:[20,10,14] };
function pushStroke(pc,mood){
  var y=H*(0.78-(pc/11)*0.52);
  var x=W*0.12+Math.random()*W*0.76;
  var dx=(Math.random()*2-1)*W*0.22, dy=(Math.random()*2-1)*H*0.16;
  var col=(Math.random()<0.08)?[185,72,53]:(PAL[mood]||PAL.neu);
  strokes.push({x:x,y:y,cx:x+dx*0.5+(Math.random()*2-1)*40,cy:y+dy*0.5+(Math.random()*2-1)*40,
    ex:x+dx,ey:y+dy,life:0,max:1.4+Math.random()*1.6,w:0.8+Math.random()*3.0,a:0.18+Math.random()*0.5,
    col:col});
}
var seedNo='----';
function frame(){
  var t=nowt();
  while(pending.length && pending[0].t<=t){ var e=pending.shift(); curHue=e.pc; pushStroke(e.pc, e.mood); }
  // ambient: keep the canvas alive even when idle (visual only, no harmonic claim)
  if(pending.length===0 && strokes.length<70 && Math.random()<0.12){ pushStroke(Math.floor(Math.random()*12), Math.random()<0.14?'dom':'neu'); }
  // fade
  cx.fillStyle='rgba(236,233,226,0.05)'; cx.fillRect(0,0,W,H);
  // glass underlay (translucent, soft)
  var g=cx.createRadialGradient(W*0.5,H*0.42,40,W*0.5,H*0.5,Math.max(W,H)*0.7);
  g.addColorStop(0,'rgba(255,255,255,0.05)'); g.addColorStop(0.5,'rgba(220,216,206,0.03)'); g.addColorStop(1,'rgba(180,176,166,0.05)');
  cx.fillStyle=g; cx.fillRect(0,0,W,H);
  // persistent generative base (guarantees visible art every frame)
  if(baseLayer) cx.drawImage(baseLayer,0,0,W,H);
  // medical cold-light sweep
  sweep=(sweep+0.4)% (W+300); var sx=sweep-150;
  var lg=cx.createLinearGradient(sx-60,0,sx+60,0); lg.addColorStop(0,'rgba(200,225,235,0)'); lg.addColorStop(0.5,'rgba(205,228,238,0.06)'); lg.addColorStop(1,'rgba(200,225,235,0)');
  cx.fillStyle=lg; cx.fillRect(sx-60,0,120,H);
  // grain
  if(grain) cx.drawImage(grain,0,0,W,H);
  // strokes (flowing curves)
  for(var i=strokes.length-1;i>=0;i--){ var s=strokes[i]; s.life+=0.016;
    var k=s.life/s.max; if(k>=1){ strokes.splice(i,1); continue; }
    var al=s.a*(1-k);
    cx.strokeStyle='rgba('+(s.col[0]+curHue*1.2|0)+','+s.col[1]+','+s.col[2]+','+al.toFixed(3)+')';
    cx.lineWidth=s.w*(1-0.4*k); cx.lineCap='round';
    cx.beginPath(); cx.moveTo(s.x,s.y); cx.quadraticCurveTo(s.cx,s.cy,s.ex,s.ey); cx.stroke();
    // drift for next frame (organic)
    s.cx+=(Math.random()*2-1)*4; s.cy+=(Math.random()*2-1)*4;
  }
  requestAnimationFrame(frame);
}

/* ---------- flow ---------- */
var sel={root:null,dens:null};
var NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var notesEl=document.getElementById('notes');
NOTES.forEach(function(n){
  var el=document.createElement('span'); el.className='nt'; el.textContent=n; el.dataset.r=ROOTS[n];
  el.onclick=function(){ if(sel.root!==null && this.classList.contains('on')){ this.classList.remove('on'); sel.root=null; document.getElementById('hRoot').classList.add('hidden'); document.getElementById('hDens').classList.add('hidden'); document.getElementById('dens').classList.add('hidden'); document.getElementById('hCard').classList.add('hidden'); document.getElementById('cardWrap').classList.add('hidden'); return; }
    Array.prototype.forEach.call(notesEl.children,function(c){c.classList.remove('on');});
    this.classList.add('on'); sel.root=ROOTS[n];
    playSingle(n);
    document.getElementById('hRoot').classList.add('hidden');
    document.getElementById('hDens').classList.remove('hidden');
    document.getElementById('dens').classList.remove('hidden');
  };
  notesEl.appendChild(el);
});
function playSingle(n){ var p=parseChord(n+'maj'); if(!p)return; var a=ac(),t0=a.currentTime+0.05; p.iv.forEach(function(iv,k){ schedNote(60+p.root+iv,t0+k*0.12,0.5,'triangle',0.1,1600); }); pending.push({t:t0,pc:p.root,mood:'neu'}); }
var densEl=document.querySelectorAll('.dm');
densEl.forEach(function(d){ d.onclick=function(){ if(sel.root===null) return; Array.prototype.forEach.call(densEl,function(x){x.classList.remove('on');}); this.classList.add('on'); sel.dens=+this.dataset.d;
  var ch=buildChord(sel.root,sel.dens); var a=ac(),t0=a.currentTime+0.05; var p=parseChord(ch); if(p){ p.iv.forEach(function(iv,k){ schedNote(60+p.root+iv,t0+k*0.12,0.6,'triangle',0.1,1600); }); pending.push({t:t0,pc:p.root,mood:moodOf(p.q)}); }
  document.getElementById('hDens').classList.add('hidden');
  document.getElementById('hCard').classList.remove('hidden');
  document.getElementById('cardWrap').classList.remove('hidden');
};});
function buildChord(rootSemi,dens){
  var iv = dens===3?[0,4,7] : dens===5?[0,4,7,9,11] : [0,4,7,10,13,16];
  var name=RN[rootSemi];
  if(dens===3) return name+'maj';
  if(dens===5) return name+'maj9';
  return name+'maj13';
}
document.getElementById('draw').onclick=function(){
  if(sel.root===null||sel.dens===null) return;
  var base=buildChord(sel.root,sel.dens);
  var prog = PROGS[Math.floor(Math.random()*PROGS.length)].slice();
  var semi = sel.root; // transpose to user root (orig progs are in C/A minor, treat as key-agnostic valid set)
  var chords=[base].concat(prog.map(function(c){ return transposeChord(c, semi); }));
  // melody from a random motif, transposed to root
  var mo=MOT.motifs[Math.floor(Math.random()*MOT.motifs.length)];
  var melody=(mo.midi_events||[]).map(function(e){ return {midi:e.midi+sel.root, startBeat:e.startBeat, durBeats:e.durBeats}; });
  var styleKey = Math.random()<0.5?'lofi':'jazz';
  playCombo(chords, melody, styleKey);
  seedNo=('000'+Math.floor(Math.random()*10000)).slice(-4);
  document.getElementById('no').textContent='No.'+seedNo;
  // reflection (hidden until hover 痕? no — until click trace)
  var tech=TECHS[Math.floor(Math.random()*TECHS.length)];
  pendingRefl='靠近：'+tech+'（原书页码待确认）';
};
var pendingRefl='';
document.getElementById('trace').onclick=function(){
  if(!pendingRefl) return;
  var r=document.getElementById('refl'); r.textContent=pendingRefl; r.classList.add('show');
  setTimeout(function(){ r.classList.remove('show'); }, 4200);
};

/* save 痕 */
function loadTraces(){ try{return JSON.parse(localStorage.getItem('1oops_traces')||'[]');}catch(e){return [];} }
document.getElementById('trace').addEventListener('contextmenu',function(e){ e.preventDefault(); var a=loadTraces(); a.push({no:seedNo,ts:Date.now()}); localStorage.setItem('1oops_traces',JSON.stringify(a)); });

resize();
for(var _b=0;_b<18;_b++){ pushStroke(Math.floor(Math.random()*12), Math.random()<0.15?'dom':'neu'); }
requestAnimationFrame(frame);
</script>
